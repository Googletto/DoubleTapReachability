name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install Theos
      run: |
        git clone https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    
    - name: Install SDK
      run: |
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        wget https://github.com/theos/sdks/raw/master/iPhoneOS17.0.sdk.tar.xz
        tar -xf iPhoneOS17.0.sdk.tar.xz
    
    - name: Build tweak
      run: |
        make clean
        make package
    
    - name: Upload DEB
      uses: actions/upload-artifact@v4   # <-- updated to v4
      with:
        name: DoubleTapReachability
        path: packages/*.deb
